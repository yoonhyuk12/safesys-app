<!-- CSI 시료봉인 목록을 비로그인 상태로 요청했을 때의 응답에서 상단 로그인 폼만 잘라낸 픽스처 -->
<html lang="ko"><head><meta charset="euc-kr"><title>CSI 시료봉인</title></head><body>
					<!-- 로그아웃 했을때 시작 -->
					<div class="top-menu">
						<form name="loginForm" id="loginForm" action="#" method="post">
							<input type="hidden"  		name="bbsId" 		value="">
							<input type="hidden"  		name="bbsNo" 		value="">
							<input type="hidden" id="case_no" 	 	name="caseNo" 		value="">
							<input type="hidden" id="nextUrl"       name="nextUrl"      value="/qtr/sample/sealng/sampleSealngList.do">
							<input type="hidden" id="reprt_seq"     name="reprtSeq"     value=""> <!--2025-06-13 아무개 최종 복원 필요-->
							<ul class="nav navbar-nav pull-right">
								<li class="dropdown dropdown-extended dropdown-user">
									<div class="form-inline">
										<div class="form-group">
											<label for="user_id" class="control-label visible-ie8 visible-ie9">아이디</label>
											<div class="input-icon">
												<i class="fa fa-user"></i>
												<input class="form-control" type="text" autocomplete="off" placeholder="아이디" name="userId" id="userId" value="" maxlength="20" tabIndex="1" style="width: 120px;">
											</div>
										</div>
										<div class="form-group">
											<label for="pswd" class="control-label visible-ie8 visible-ie9">비밀번호</label>
											<div class="input-icon">
												<i class="fa fa-lock"></i>
												<input class="form-control" type="password" autocomplete="off" placeholder="비밀번호" name="pswd" id="pswd" value="" tabIndex="2" onkeydown="if (event.keyCode == 13) go_login('N')" style="width: 120px;">
											</div>
										</div>
									</div>
								</li>
								<li class="dropdown dropdown-extended dropdown-inbox">
									<a class="login-btn" href="javascript:go_login('N')">로그인</a>
								</li>
									
								<li class="dropdown dropdown-extended dropdown-inbox">
								<a class="user-btn" onclick="handleMoveSignUpPage()">회원가입</a>
								</li>
								<li class="dropdown dropdown-extended dropdown-inbox">
									<a class="idpw-btn" href="https://www.csi.go.kr/por/findUserCertiPop.do" onclick="window.open(this.href,'_blank','width=400,height=400,menubar=no,toolbar=no,scrollbars=yes,resizable=yes'); return false;">아이디/비밀번호 찾기</a>
								</li>
</body></html>
